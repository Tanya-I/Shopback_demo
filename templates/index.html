<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Logo Upload Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg p-4 rounded-4">
            <h2 class="mb-4 text-center text-primary fw-bold">Brand Logo Upload Portal</h2>
            <p class="text-muted text-center">Upload your brand logo and we’ll generate all required assets automatically.</p>
            <form method="POST" action="/upload" enctype="multipart/form-data" class="mt-4">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Brand ID</label>
                    <input type="text" name="brand_id" class="form-control" placeholder="Enter Brand ID" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Upload Logo</label>
                    <input type="file" name="file" class="form-control" accept="image/png, image/jpeg" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill">🚀 Process Logo</button>
            </form>
        </div>
    </div>
</body>
</html>
