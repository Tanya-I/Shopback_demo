<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg p-4 rounded-4">
            <h2 class="mb-4 text-success fw-bold">✅ Assets Generated for {{ brand_id }}</h2>
            <p class="text-muted">All assets saved in: <code>{{ output_dir }}</code></p>

            <div class="row">
                {% for img in images %}
                <div class="col-md-4 text-center mb-4">
                    <img src="{{ url_for('static', filename=img) }}" class="img-fluid border rounded shadow-sm mb-2">
                    <p class="fw-semibold">{{ img.split('/')[-1] }}</p>
                </div>
                {% endfor %}
            </div>

            {% if email_status %}
                <div class="alert alert-success">📧 {{ email_status }}</div>
            {% else %}
                <div class="alert alert-danger">⚠️ Failed to send email.</div>
            {% endif %}

            <a href="/" class="btn btn-outline-primary rounded-pill mt-3">⬅️ Upload Another Logo</a>
        </div>
    </div>
</body>
</html>
